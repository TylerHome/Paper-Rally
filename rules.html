<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Paper Rally – Rules</title><meta name="viewport" content="width=device-width, initial-scale=1"><style>body{margin:0;background:#eceae4;display:flex;justify-content:center;padding:12px}.page{width:100%;max-width:420px;aspect-ratio:148/210;background:#fff;box-shadow:0 2px 12px #0004}.page svg{width:100%;height:100%;display:block}@page{size:A5 portrait;margin:0}@media print{body{background:#fff;padding:0;display:block}.page{width:148mm;height:210mm;max-width:none;box-shadow:none}}</style></head><body><div class="page"><svg viewBox="0 0 148 210" xmlns="http://www.w3.org/2000/svg" font-family="'Space Mono','Courier New',monospace">

 <text x="8" y="14" font-size="7" font-weight="700">RULES</text><text x="140" y="14" font-size="3.2" text-anchor="end" fill="#666">Paper Rally</text><g transform="translate(22 34.5)"><g transform="translate(-8 0)"><rect x="-2" y="-6" width="2" height="2" fill="#111"/><rect x="0" y="-6" width="2" height="2" fill="#fff"/><rect x="-2" y="-4" width="2" height="2" fill="#fff"/><rect x="0" y="-4" width="2" height="2" fill="#111"/><rect x="-2" y="-2" width="2" height="2" fill="#111"/><rect x="0" y="-2" width="2" height="2" fill="#fff"/><rect x="-2" y="0" width="2" height="2" fill="#fff"/><rect x="0" y="0" width="2" height="2" fill="#111"/><rect x="-2" y="2" width="2" height="2" fill="#111"/><rect x="0" y="2" width="2" height="2" fill="#fff"/><rect x="-2" y="4" width="2" height="2" fill="#fff"/><rect x="0" y="4" width="2" height="2" fill="#111"/><rect x="-2" y="-6" width="4" height="12" fill="none" stroke="#111" stroke-width=".35"/></g><g transform="translate(3.00 0.00) scale(0.95)"><rect x="-2.1" y="3.6" width="4.2" height="1.1" rx=".3" fill="#111"/><rect x="-1.4" y="-4.20" width="1.4" height="1.56" fill="#111"/><rect x="0" y="-4.20" width="1.4" height="1.56" fill="#fff"/><rect x="-1.4" y="-2.64" width="1.4" height="1.56" fill="#fff"/><rect x="0" y="-2.64" width="1.4" height="1.56" fill="#111"/><rect x="-1.4" y="-1.08" width="1.4" height="1.56" fill="#111"/><rect x="0" y="-1.08" width="1.4" height="1.56" fill="#fff"/><rect x="-1.4" y="0.48" width="1.4" height="1.56" fill="#fff"/><rect x="0" y="0.48" width="1.4" height="1.56" fill="#111"/><rect x="-1.4" y="2.04" width="1.4" height="1.56" fill="#111"/><rect x="0" y="2.04" width="1.4" height="1.56" fill="#fff"/><rect x="-1.4" y="-4.2" width="2.8" height="7.8" fill="none" stroke="#111" stroke-width=".4"/><circle cx="0" cy="-5.1" r=".9" fill="#111"/></g><g transform="translate(11.00 0.00) scale(0.95)"><rect x="-2.1" y="3.6" width="4.2" height="1.1" rx=".3" fill="#111"/><rect x="-1.4" y="-4.20" width="1.4" height="1.56" fill="#111"/><rect x="0" y="-4.20" width="1.4" height="1.56" fill="#fff"/><rect x="-1.4" y="-2.64" width="1.4" height="1.56" fill="#fff"/><rect x="0" y="-2.64" width="1.4" height="1.56" fill="#111"/><rect x="-1.4" y="-1.08" width="1.4" height="1.56" fill="#111"/><rect x="0" y="-1.08" width="1.4" height="1.56" fill="#fff"/><rect x="-1.4" y="0.48" width="1.4" height="1.56" fill="#fff"/><rect x="0" y="0.48" width="1.4" height="1.56" fill="#111"/><rect x="-1.4" y="2.04" width="1.4" height="1.56" fill="#111"/><rect x="0" y="2.04" width="1.4" height="1.56" fill="#fff"/><rect x="-1.4" y="-4.2" width="2.8" height="7.8" fill="none" stroke="#111" stroke-width=".4"/><circle cx="0" cy="-5.1" r=".9" fill="#111"/></g></g><text x="44" y="29.6" font-size="3.6" font-weight="700">START LINE & FINISH TOTEMS</text><text x="44" y="34.6" font-size="3.1" fill="#333">Start behind the checkered START line. The</text><text x="44" y="38.9" font-size="3.1" fill="#333">race ends when you pass between the two</text><text x="44" y="43.2" font-size="3.1" fill="#333">FINISH totems.</text><line x1="8" x2="140" y1="45.8" y2="45.8" stroke="#ccc" stroke-width=".3"/><g transform="translate(22 55.5)"><rect x="-11.3" y="-2.3" width="4.6" height="4.6" rx=".7" fill="#111" stroke="#111" stroke-width=".7"/><rect x="-5.3" y="-2.3" width="4.6" height="4.6" rx=".7" fill="#fff" stroke="#111" stroke-width=".7"/><rect x="0.7000000000000002" y="-2.3" width="4.6" height="4.6" rx=".7" fill="#fff" stroke="#111" stroke-width=".7"/><rect x="6.7" y="-2.3" width="4.6" height="4.6" rx=".7" fill="#fff" stroke="#111" stroke-width=".7"/><clipPath id="rC3"><rect x="0.7" y="-2.3" width="4.6" height="4.6"/></clipPath><g clip-path="url(#rC3)"><line x1="-4.4" y1="3" x2="1.5999999999999996" y2="-3" stroke="#111" stroke-width=".5"/><line x1="-2.9000000000000004" y1="3" x2="3.0999999999999996" y2="-3" stroke="#111" stroke-width=".5"/><line x1="-1.4000000000000001" y1="3" x2="4.6" y2="-3" stroke="#111" stroke-width=".5"/><line x1="0.09999999999999964" y1="3" x2="6.1" y2="-3" stroke="#111" stroke-width=".5"/></g><circle cx="9" cy="0" r="1.2" fill="#111"/></g><text x="44" y="50.6" font-size="3.6" font-weight="700">YOUR CAR · 2 TO 4 PLAYERS</text><text x="44" y="55.6" font-size="3.1" fill="#333">2 to 4 players. Each player picks a different</text><text x="44" y="59.9" font-size="3.1" fill="#333">square type. Roll the die and move that many</text><text x="44" y="64.2" font-size="3.1" fill="#333">squares, then mark the square where you stop.</text><line x1="8" x2="140" y1="66.8" y2="66.8" stroke="#ccc" stroke-width=".3"/><g transform="translate(22 76.5)"><rect x="-2.3" y="-2.3" width="4.6" height="4.6" rx=".7" fill="#111"/><path d="M3.70 0.00L7.40 0.00M5.91 -0.82L7.40 0.00L5.91 0.82" fill="none" stroke="#111" stroke-width=".55" stroke-linecap="round" stroke-linejoin="round"/><path d="M2.62 2.62L5.23 5.23M4.75 3.60L5.23 5.23L3.60 4.75" fill="none" stroke="#111" stroke-width=".55" stroke-linecap="round" stroke-linejoin="round"/><path d="M0.00 3.70L0.00 7.40M0.82 5.91L0.00 7.40L-0.82 5.91" fill="none" stroke="#111" stroke-width=".55" stroke-linecap="round" stroke-linejoin="round"/><path d="M-2.62 2.62L-5.23 5.23M-3.60 4.75L-5.23 5.23L-4.75 3.60" fill="none" stroke="#111" stroke-width=".55" stroke-linecap="round" stroke-linejoin="round"/><path d="M-3.70 0.00L-7.40 0.00M-5.91 0.82L-7.40 0.00L-5.91 -0.82" fill="none" stroke="#111" stroke-width=".55" stroke-linecap="round" stroke-linejoin="round"/><path d="M-2.62 -2.62L-5.23 -5.23M-4.75 -3.60L-5.23 -5.23L-3.60 -4.75" fill="none" stroke="#111" stroke-width=".55" stroke-linecap="round" stroke-linejoin="round"/><path d="M-0.00 -3.70L-0.00 -7.40M-0.82 -5.91L-0.00 -7.40L0.82 -5.91" fill="none" stroke="#111" stroke-width=".55" stroke-linecap="round" stroke-linejoin="round"/><path d="M2.62 -2.62L5.23 -5.23M3.60 -4.75L5.23 -5.23L4.75 -3.60" fill="none" stroke="#111" stroke-width=".55" stroke-linecap="round" stroke-linejoin="round"/></g><text x="44" y="71.6" font-size="3.6" font-weight="700">MOVEMENT</text><text x="44" y="76.6" font-size="3.1" fill="#333">You may move in any direction, even backwards.</text><text x="44" y="80.89999999999999" font-size="3.1" fill="#333">You cannot pass over a car on the track.</text><line x1="8" x2="140" y1="83.8" y2="83.8" stroke="#ccc" stroke-width=".3"/><g transform="translate(22 93.5)"><rect x="-12" y="-5.5" width="24" height="11" rx="1.5" fill="#5a5a5a"/><circle cx="-10" cy="-5" r=".42" fill="#b9b9b9"/><circle cx="-10" cy="0" r=".42" fill="#b9b9b9"/><circle cx="-10" cy="5" r=".42" fill="#b9b9b9"/><circle cx="-5" cy="-5" r=".42" fill="#b9b9b9"/><circle cx="-5" cy="0" r=".42" fill="#b9b9b9"/><circle cx="-5" cy="5" r=".42" fill="#b9b9b9"/><circle cx="0" cy="-5" r=".42" fill="#b9b9b9"/><circle cx="0" cy="0" r=".42" fill="#b9b9b9"/><circle cx="0" cy="5" r=".42" fill="#b9b9b9"/><circle cx="5" cy="-5" r=".42" fill="#b9b9b9"/><circle cx="5" cy="0" r=".42" fill="#b9b9b9"/><circle cx="5" cy="5" r=".42" fill="#b9b9b9"/><circle cx="10" cy="-5" r=".42" fill="#b9b9b9"/><circle cx="10" cy="0" r=".42" fill="#b9b9b9"/><circle cx="10" cy="5" r=".42" fill="#b9b9b9"/></g><text x="44" y="88.6" font-size="3.6" font-weight="700">ASPHALT</text><text x="44" y="93.6" font-size="3.1" fill="#333">Boost: on every roll you move one square</text><text x="44" y="97.89999999999999" font-size="3.1" fill="#333">more than the number rolled.</text><line x1="8" x2="140" y1="100.8" y2="100.8" stroke="#ccc" stroke-width=".3"/><g transform="translate(22 110.5)"><rect x="-12" y="-5.5" width="24" height="11" rx="1.5" fill="url(#rH)" stroke="#bbb" stroke-width=".3"/><circle cx="-10" cy="-5" r=".42" fill="#9a9a9a"/><circle cx="-10" cy="0" r=".42" fill="#9a9a9a"/><circle cx="-10" cy="5" r=".42" fill="#9a9a9a"/><circle cx="-5" cy="-5" r=".42" fill="#9a9a9a"/><circle cx="-5" cy="0" r=".42" fill="#9a9a9a"/><circle cx="-5" cy="5" r=".42" fill="#9a9a9a"/><circle cx="0" cy="-5" r=".42" fill="#9a9a9a"/><circle cx="0" cy="0" r=".42" fill="#9a9a9a"/><circle cx="0" cy="5" r=".42" fill="#9a9a9a"/><circle cx="5" cy="-5" r=".42" fill="#9a9a9a"/><circle cx="5" cy="0" r=".42" fill="#9a9a9a"/><circle cx="5" cy="5" r=".42" fill="#9a9a9a"/><circle cx="10" cy="-5" r=".42" fill="#9a9a9a"/><circle cx="10" cy="0" r=".42" fill="#9a9a9a"/><circle cx="10" cy="5" r=".42" fill="#9a9a9a"/></g><text x="44" y="105.6" font-size="3.6" font-weight="700">GRAVEL</text><text x="44" y="110.6" font-size="3.1" fill="#333">No bonus: you move exactly the number</text><text x="44" y="114.89999999999999" font-size="3.1" fill="#333">shown on the die.</text><line x1="8" x2="140" y1="117.8" y2="117.8" stroke="#ccc" stroke-width=".3"/><g transform="translate(22 127.5)"><path d="M-9 0C-9 -4 -4 -6 0 -5C4 -6 9 -3 8.5 1C9.5 4.5 3 6 -1 5C-5 6.5 -9 4 -9 0Z" fill="#c6ccd9"/><circle cx="-3" cy="0" r=".42" fill="#8b93a6"/><circle cx="3" cy="0" r=".42" fill="#8b93a6"/></g><text x="44" y="122.6" font-size="3.6" font-weight="700">PUDDLE</text><text x="44" y="127.6" font-size="3.1" fill="#333">If you hit a puddle you stop right there.</text><text x="44" y="131.9" font-size="3.1" fill="#333">Your roll ends, even with squares left.</text><line x1="8" x2="140" y1="134.8" y2="134.8" stroke="#ccc" stroke-width=".3"/><g transform="translate(22 144.5)"><clipPath id="rC2"><rect x="-13" y="-8.5" width="26" height="17" rx="1.5"/></clipPath><g clip-path="url(#rC2)"><path d="M-14 -4C0 -4 6 -1 6 9" fill="none" stroke="#5a5a5a" stroke-width="5"/></g><circle cx="-10" cy="-4" r=".42" fill="#b9b9b9"/><circle cx="-5" cy="-4" r=".42" fill="#b9b9b9"/><circle cx="-10" cy="2" r=".42" fill="#a3a3a3"/><circle cx="-5" cy="2" r=".42" fill="#a3a3a3"/><circle cx="0" cy="4" r=".42" fill="#a3a3a3"/><circle cx="12" cy="2" r=".42" fill="#a3a3a3"/><circle cx="8" cy="3" r=".42" fill="#a3a3a3"/><rect x="5.7" y="-6" width="4.6" height="4.6" rx=".8" fill="#111"/><path transform="translate(-7 6) scale(1.4)" d="M0 -1.9 L1.2 -.3 H.5 L1.5 1.2 H.3 V1.9 H-.3 V1.2 H-1.5 L-.5 -.3 H-1.2Z" fill="#111"/><path transform="translate(1 6.5) scale(1.3)" d="M0 -1.9a1.5 1.4 0 1 1 0 2.8a1.5 1.4 0 1 1 0 -2.8ZM-.3 .8H.3V1.9H-.3Z" fill="#111"/><text x="-8" y="-2.6" font-size="4" font-weight="700" text-anchor="middle" fill="#fff">½</text></g><text x="44" y="139.6" font-size="3.6" font-weight="700">OFF-ROAD</text><text x="44" y="144.6" font-size="3.1" fill="#333">You may leave the track by one square only;</text><text x="44" y="148.9" font-size="3.1" fill="#333">the remaining squares are halved. E.g. roll 4,</text><text x="44" y="153.2" font-size="3.1" fill="#333">off-road on the 2nd square: 2 left, move 1.</text><text x="44" y="157.5" font-size="3.1" fill="#333">(Odd remainder rounds down: 3 left = 1.5, so</text><text x="44" y="161.79999999999998" font-size="3.1" fill="#333">move 1.) You must return to the track.</text><line x1="8" x2="140" y1="164.8" y2="164.8" stroke="#ccc" stroke-width=".3"/><g transform="translate(22 174.5)"><clipPath id="rC"><rect x="-14" y="-7" width="28" height="14" rx="1.5"/></clipPath><g clip-path="url(#rC)"><rect x="-14" y="-7" width="28" height="14" fill="#5a5a5a"/><path d="M-14 -7L0 -7L0 7L-14 7Z" fill="url(#rGR)"/><path d="M0 -7L3.5 -7L3.5 7L0 7Z" fill="url(#rGS)"/><path d="M-10.9 -1.6L-9.3 0L-10.9 1.6" fill="none" stroke="#111" stroke-width="1.1" stroke-linejoin="round"/><path d="M-10.9 -1.6L-9.3 0L-10.9 1.6" fill="none" stroke="#fff" stroke-width=".45" stroke-linejoin="round"/><path d="M-6.9 -1.6L-5.3 0L-6.9 1.6" fill="none" stroke="#111" stroke-width="1.1" stroke-linejoin="round"/><path d="M-6.9 -1.6L-5.3 0L-6.9 1.6" fill="none" stroke="#fff" stroke-width=".45" stroke-linejoin="round"/><path d="M-2.9 -1.6L-1.3 0L-2.9 1.6" fill="none" stroke="#111" stroke-width="1.1" stroke-linejoin="round"/><path d="M-2.9 -1.6L-1.3 0L-2.9 1.6" fill="none" stroke="#fff" stroke-width=".45" stroke-linejoin="round"/><path d="M0 -7L0 7" fill="none" stroke="#111" stroke-width=".9"/></g></g><text x="44" y="169.6" font-size="3.6" font-weight="700">BUMP / JUMP</text><text x="44" y="174.6" font-size="3.1" fill="#333">A rise in the road. If your roll takes you past</text><text x="44" y="178.9" font-size="3.1" fill="#333">the crest, you get +2 squares.</text><line x1="8" x2="140" y1="181.8" y2="181.8" stroke="#ccc" stroke-width=".3"/><g transform="translate(22 191.5)"><path transform="translate(-8 0) scale(1.9)" d="M0 -1.9 L1.2 -.3 H.5 L1.5 1.2 H.3 V1.9 H-.3 V1.2 H-1.5 L-.5 -.3 H-1.2Z" fill="#111"/><path transform="translate(0 0) scale(1.9)" d="M0 -1.9a1.5 1.4 0 1 1 0 2.8a1.5 1.4 0 1 1 0 -2.8ZM-.3 .8H.3V1.9H-.3Z" fill="#111"/><g transform="translate(8.5 0) scale(1.9)"><path d="M-2.3 1.9L-.6 -1.9L.5 .1L1 -.7L2.3 1.9Z" fill="#3d3d3d"/><path d="M-.6 -1.9L-1.2 -.7L-.6 -1L0 -.7Z" fill="#fff"/></g></g><text x="44" y="186.6" font-size="3.6" font-weight="700">TREES & MOUNTAINS</text><text x="44" y="191.6" font-size="3.1" fill="#333">Scenery off the track. White dotted areas</text><text x="44" y="195.9" font-size="3.1" fill="#333">are off-road.</text></svg></div></body></html>
