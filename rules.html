<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Paper Rally – Rules</title><meta name="viewport" content="width=device-width, initial-scale=1"><style>body{margin:0;background:#eceae4;display:flex;justify-content:center;padding:12px}.page{width:100%;max-width:420px;aspect-ratio:148/210;background:#fff;box-shadow:0 2px 12px #0004}.page svg{width:100%;height:100%;display:block}@page{size:A5 portrait;margin:0}@media print{body{background:#fff;padding:0;display:block}.page{width:148mm;height:210mm;max-width:none;box-shadow:none}}</style></head><body><div class="page"><svg viewBox="0 0 148 210" xmlns="http://www.w3.org/2000/svg" font-family="'Space Mono','Courier New',monospace">
 <defs><pattern id="rH" width="1.5" height="1.5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="1.5" height="1.5" fill="#efefef"/><line x1="0" y1="0" x2="0" y2="1.5" stroke="#8c8c8c" stroke-width=".45"/></pattern>
 <linearGradient id="rGR" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".6"/></linearGradient>
 <linearGradient id="rGS" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000" stop-opacity=".65"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient></defs>
 <rect width="148" height="210" fill="#fff"/>
 <text x="8" y="14" font-size="7" font-weight="700">RULES</text><text x="140" y="14" font-size="3.2" text-anchor="end" fill="#666">Paper Rally</text><g transform="translate(22 34.5)"><rect x="-2" y="-6" width="2" height="2" fill="#111"/><rect x="0" y="-6" width="2" height="2" fill="#fff"/><rect x="-2" y="-4" width="2" height="2" fill="#fff"/><rect x="0" y="-4" width="2" height="2" fill="#111"/><rect x="-2" y="-2" width="2" height="2" fill="#111"/><rect x="0" y="-2" width="2" height="2" fill="#fff"/><rect x="-2" y="0" width="2" height="2" fill="#fff"/><rect x="0" y="0" width="2" height="2" fill="#111"/><rect x="-2" y="2" width="2" height="2" fill="#111"/><rect x="0" y="2" width="2" height="2" fill="#fff"/><rect x="-2" y="4" width="2" height="2" fill="#fff"/><rect x="0" y="4" width="2" height="2" fill="#111"/><rect x="-2" y="-6" width="4" height="12" fill="none" stroke="#111" stroke-width=".35"/></g><text x="44" y="29.6" font-size="3.6" font-weight="700">CHECKERED LINE</text><text x="44" y="34.6" font-size="3.1" fill="#333">Start behind the START line. The race ends</text><text x="44" y="38.9" font-size="3.1" fill="#333">when you cross the FINISH line.</text><line x1="8" x2="140" y1="43.5" y2="43.5" stroke="#ccc" stroke-width=".3"/><g transform="translate(22 55.5)"><circle cx="-10" cy="-5" r=".42" fill="#a3a3a3"/><circle cx="-10" cy="0" r=".42" fill="#a3a3a3"/><circle cx="-10" cy="5" r=".42" fill="#a3a3a3"/><circle cx="-5" cy="-5" r=".42" fill="#a3a3a3"/><circle cx="-5" cy="0" r=".42" fill="#a3a3a3"/><circle cx="-5" cy="5" r=".42" fill="#a3a3a3"/><circle cx="0" cy="-5" r=".42" fill="#a3a3a3"/><circle cx="0" cy="5" r=".42" fill="#a3a3a3"/><circle cx="5" cy="-5" r=".42" fill="#a3a3a3"/><circle cx="5" cy="0" r=".42" fill="#a3a3a3"/><circle cx="5" cy="5" r=".42" fill="#a3a3a3"/><circle cx="10" cy="-5" r=".42" fill="#a3a3a3"/><circle cx="10" cy="0" r=".42" fill="#a3a3a3"/><circle cx="10" cy="5" r=".42" fill="#a3a3a3"/><rect x="-2.5" y="-2.5" width="5" height="5" rx=".8" fill="#111"/></g><text x="44" y="50.6" font-size="3.6" font-weight="700">BLACK SQUARE = YOUR CAR</text><text x="44" y="55.6" font-size="3.1" fill="#333">Roll the die and move your car that many</text><text x="44" y="59.9" font-size="3.1" fill="#333">squares. Blacken the square where you stop.</text><line x1="8" x2="140" y1="64.5" y2="64.5" stroke="#ccc" stroke-width=".3"/><g transform="translate(22 76.5)"><rect x="-12" y="-5.5" width="24" height="11" rx="1.5" fill="#5a5a5a"/><circle cx="-10" cy="-5" r=".42" fill="#b9b9b9"/><circle cx="-10" cy="0" r=".42" fill="#b9b9b9"/><circle cx="-10" cy="5" r=".42" fill="#b9b9b9"/><circle cx="-5" cy="-5" r=".42" fill="#b9b9b9"/><circle cx="-5" cy="0" r=".42" fill="#b9b9b9"/><circle cx="-5" cy="5" r=".42" fill="#b9b9b9"/><circle cx="0" cy="-5" r=".42" fill="#b9b9b9"/><circle cx="0" cy="0" r=".42" fill="#b9b9b9"/><circle cx="0" cy="5" r=".42" fill="#b9b9b9"/><circle cx="5" cy="-5" r=".42" fill="#b9b9b9"/><circle cx="5" cy="0" r=".42" fill="#b9b9b9"/><circle cx="5" cy="5" r=".42" fill="#b9b9b9"/><circle cx="10" cy="-5" r=".42" fill="#b9b9b9"/><circle cx="10" cy="0" r=".42" fill="#b9b9b9"/><circle cx="10" cy="5" r=".42" fill="#b9b9b9"/></g><text x="44" y="71.6" font-size="3.6" font-weight="700">ASPHALT</text><text x="44" y="76.6" font-size="3.1" fill="#333">Boost: on every roll you move one square</text><text x="44" y="80.89999999999999" font-size="3.1" fill="#333">more than the number rolled.</text><line x1="8" x2="140" y1="85.5" y2="85.5" stroke="#ccc" stroke-width=".3"/><g transform="translate(22 97.5)"><rect x="-12" y="-5.5" width="24" height="11" rx="1.5" fill="url(#rH)" stroke="#bbb" stroke-width=".3"/><circle cx="-10" cy="-5" r=".42" fill="#9a9a9a"/><circle cx="-10" cy="0" r=".42" fill="#9a9a9a"/><circle cx="-10" cy="5" r=".42" fill="#9a9a9a"/><circle cx="-5" cy="-5" r=".42" fill="#9a9a9a"/><circle cx="-5" cy="0" r=".42" fill="#9a9a9a"/><circle cx="-5" cy="5" r=".42" fill="#9a9a9a"/><circle cx="0" cy="-5" r=".42" fill="#9a9a9a"/><circle cx="0" cy="0" r=".42" fill="#9a9a9a"/><circle cx="0" cy="5" r=".42" fill="#9a9a9a"/><circle cx="5" cy="-5" r=".42" fill="#9a9a9a"/><circle cx="5" cy="0" r=".42" fill="#9a9a9a"/><circle cx="5" cy="5" r=".42" fill="#9a9a9a"/><circle cx="10" cy="-5" r=".42" fill="#9a9a9a"/><circle cx="10" cy="0" r=".42" fill="#9a9a9a"/><circle cx="10" cy="5" r=".42" fill="#9a9a9a"/></g><text x="44" y="92.6" font-size="3.6" font-weight="700">GRAVEL</text><text x="44" y="97.6" font-size="3.1" fill="#333">No bonus: you move exactly the number</text><text x="44" y="101.89999999999999" font-size="3.1" fill="#333">shown on the die.</text><line x1="8" x2="140" y1="106.5" y2="106.5" stroke="#ccc" stroke-width=".3"/><g transform="translate(22 118.5)"><path d="M-9 0C-9 -4 -4 -6 0 -5C4 -6 9 -3 8.5 1C9.5 4.5 3 6 -1 5C-5 6.5 -9 4 -9 0Z" fill="#c6ccd9"/><circle cx="-3" cy="0" r=".42" fill="#8b93a6"/><circle cx="3" cy="0" r=".42" fill="#8b93a6"/></g><text x="44" y="113.6" font-size="3.6" font-weight="700">PUDDLE</text><text x="44" y="118.6" font-size="3.1" fill="#333">If you hit a puddle you stop right there.</text><text x="44" y="122.89999999999999" font-size="3.1" fill="#333">Your roll ends, even with squares left.</text><line x1="8" x2="140" y1="127.5" y2="127.5" stroke="#ccc" stroke-width=".3"/><g transform="translate(22 139.5)"><rect x="-13" y="-7.5" width="26" height="5" rx="1.5" fill="#5a5a5a"/><circle cx="-10" cy="-5" r=".42" fill="#b9b9b9"/><circle cx="-5" cy="-5" r=".42" fill="#b9b9b9"/><circle cx="0" cy="-5" r=".42" fill="#b9b9b9"/><circle cx="5" cy="-5" r=".42" fill="#b9b9b9"/><circle cx="10" cy="-5" r=".42" fill="#b9b9b9"/><circle cx="-10" cy="0" r=".42" fill="#a3a3a3"/><circle cx="0" cy="0" r=".42" fill="#a3a3a3"/><circle cx="-10" cy="5" r=".42" fill="#a3a3a3"/><circle cx="-5" cy="5" r=".42" fill="#a3a3a3"/><circle cx="0" cy="5" r=".42" fill="#a3a3a3"/><circle cx="5" cy="5" r=".42" fill="#a3a3a3"/><rect x="-7.5" y="-2.5" width="5" height="5" rx=".8" fill="#111"/><path transform="translate(5 0) scale(1.5)" d="M0 -1.9 L1.2 -.3 H.5 L1.5 1.2 H.3 V1.9 H-.3 V1.2 H-1.5 L-.5 -.3 H-1.2Z" fill="#111"/><path transform="translate(10 5) scale(1.5)" d="M0 -1.9a1.5 1.4 0 1 1 0 2.8a1.5 1.4 0 1 1 0 -2.8ZM-.3 .8H.3V1.9H-.3Z" fill="#111"/><text x="10" y="-3.4" font-size="4.2" font-weight="700" text-anchor="middle" fill="#fff">½</text></g><text x="44" y="134.6" font-size="3.6" font-weight="700">OFF-ROAD</text><text x="44" y="139.6" font-size="3.1" fill="#333">You may leave the track by one square only;</text><text x="44" y="143.9" font-size="3.1" fill="#333">the remaining squares are halved. E.g. roll 4,</text><text x="44" y="148.2" font-size="3.1" fill="#333">off-road on the 2nd square: 2 left, move 1.</text><text x="44" y="152.5" font-size="3.1" fill="#333">(Odd remainder rounds down: 3 left = 1.5, so</text><text x="44" y="156.79999999999998" font-size="3.1" fill="#333">move 1.) You must return to the track.</text><line x1="8" x2="140" y1="157.5" y2="157.5" stroke="#ccc" stroke-width=".3"/><g transform="translate(22 169.5)"><clipPath id="rC"><rect x="-14" y="-7" width="28" height="14" rx="1.5"/></clipPath><g clip-path="url(#rC)"><rect x="-14" y="-7" width="28" height="14" fill="#5a5a5a"/><path d="M-14 -7L0 -7Q3 0 0 7L-14 7Z" fill="url(#rGR)"/><path d="M0 -7L3.5 -7Q6.5 0 3.5 7L0 7Q3 0 0 -7Z" fill="url(#rGS)"/><path d="M-10.9 -1.6L-9.3 0L-10.9 1.6" fill="none" stroke="#111" stroke-width="1.1" stroke-linejoin="round"/><path d="M-10.9 -1.6L-9.3 0L-10.9 1.6" fill="none" stroke="#fff" stroke-width=".45" stroke-linejoin="round"/><path d="M-6.9 -1.6L-5.3 0L-6.9 1.6" fill="none" stroke="#111" stroke-width="1.1" stroke-linejoin="round"/><path d="M-6.9 -1.6L-5.3 0L-6.9 1.6" fill="none" stroke="#fff" stroke-width=".45" stroke-linejoin="round"/><path d="M-2.9 -1.6L-1.3 0L-2.9 1.6" fill="none" stroke="#111" stroke-width="1.1" stroke-linejoin="round"/><path d="M-2.9 -1.6L-1.3 0L-2.9 1.6" fill="none" stroke="#fff" stroke-width=".45" stroke-linejoin="round"/><path d="M0 -7Q3 0 0 7" fill="none" stroke="#111" stroke-width=".9"/></g></g><text x="44" y="164.6" font-size="3.6" font-weight="700">BUMP / JUMP</text><text x="44" y="169.6" font-size="3.1" fill="#333">A rise in the road. If your roll takes you past</text><text x="44" y="173.9" font-size="3.1" fill="#333">the crest, you get +2 squares.</text><line x1="8" x2="140" y1="178.5" y2="178.5" stroke="#ccc" stroke-width=".3"/><g transform="translate(22 190.5)"><path transform="translate(-8 0) scale(1.9)" d="M0 -1.9 L1.2 -.3 H.5 L1.5 1.2 H.3 V1.9 H-.3 V1.2 H-1.5 L-.5 -.3 H-1.2Z" fill="#111"/><path transform="translate(0 0) scale(1.9)" d="M0 -1.9a1.5 1.4 0 1 1 0 2.8a1.5 1.4 0 1 1 0 -2.8ZM-.3 .8H.3V1.9H-.3Z" fill="#111"/><g transform="translate(8.5 0) scale(1.9)"><path d="M-2.3 1.9L-.6 -1.9L.5 .1L1 -.7L2.3 1.9Z" fill="#3d3d3d"/><path d="M-.6 -1.9L-1.2 -.7L-.6 -1L0 -.7Z" fill="#fff"/></g></g><text x="44" y="185.6" font-size="3.6" font-weight="700">TREES & MOUNTAINS</text><text x="44" y="190.6" font-size="3.1" fill="#333">Scenery off the track. White dotted areas</text><text x="44" y="194.9" font-size="3.1" fill="#333">are off-road.</text></svg></div></body></html>
